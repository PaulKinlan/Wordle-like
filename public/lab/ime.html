<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <meta name="robots" content="noindex" />
    <title>Keyboard lab</title>
    <link rel="stylesheet" href="/lab/ime.css" />

  <body>
    <h1>Keyboard lab</h1>
    <p>
      Tap each field and type a word like <b>crane</b>, then try a long-press accent like <b>é</b>. Tick
      whether word predictions appeared above the keys. Your answers are kept on this phone; press
      <b>Copy results</b> at the end and paste them back.
    </p>
    <ol id="variants"></ol>
    <p><button id="copy" type="button">Copy results</button> <span id="copied" hidden>Copied</span></p>
    <p class="ua" id="ua"></p>
  </body>
